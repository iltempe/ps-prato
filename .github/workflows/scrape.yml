name: scrape-ps

# Deploy 100% remoto: la raccolta gira su GitHub, non serve tenere acceso nulla.
#
# PERCHE' NON UN SEMPLICE CRON */15:
#   Il cron di GitHub Actions e' "best-effort" e sui repo piccoli viene
#   pesantemente strozzato: puo' passare da 1 esecuzione ogni poche ore invece
#   che ogni 15 min. Per avere davvero un campione ogni 15 min usiamo un unico
#   run a lunga durata (fino a ~5,5h, il massimo di un job) che campiona in
#   loop e committa a ogni giro. Finche' quel run e' vivo, la cadenza e' esatta.
#
# RIAVVIO DELLA CATENA (a fine run, ~5,5h):
#   - se e' impostato il secret PS_PAT (Personal Access Token con Actions:write),
#     il run ri-lancia se stesso -> copertura 24/7 senza buchi, tutto su GitHub.
#   - altrimenti il riavvio dipende dallo schedule cron qui sotto (best-effort):
#     funziona comunque, ma tra un run e il successivo puo' esserci un buco.

on:
  schedule:
    # Kicker: se nessun run e' vivo, prova a farne ripartire uno. Minuti sfasati
    # dagli slot congestionati (:00/:15/:30/:45).
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      durata_min:
        description: "Durata del loop in minuti (solo per test: es. 1 per un run lampo)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Un solo run alla volta: il long-run tiene il gruppo, i tentativi dello
  # schedule mentre e' vivo vengono scartati (niente doppioni).
  group: scrape-ps
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # limite hard di GitHub e' 360; stiamo sotto
    env:
      DURATA_MIN: "330"           # durata del loop (~5,5h)
      INTERVALLO_SEC: "900"       # 15 minuti tra un campione e l'altro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Loop di campionamento
        run: |
          set -u
          git config user.name  "ps-scraper-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DUR="${{ github.event.inputs.durata_min }}"
          [ -n "$DUR" ] && DURATA_MIN="$DUR"
          echo "Durata loop: ${DURATA_MIN} min, intervallo: ${INTERVALLO_SEC}s"
          FINE=$(( $(date +%s) + DURATA_MIN*60 ))
          while : ; do
            python scraper.py || true
            git add data/
            if ! git diff --staged --quiet ; then
              git commit -q -m "dati: $(date -u +%FT%TZ)"
              if ! git push -q ; then
                # push concorrente (es. commit manuale): riparti dal remoto e
                # ricampiona, cosi' non si creano conflitti sulla coda del CSV.
                git fetch -q origin main
                git reset -q --hard origin/main
                python scraper.py || true
                git add data/
                git diff --staged --quiet || { git commit -q -m "dati: $(date -u +%FT%TZ)"; git push -q || true; }
              fi
            fi
            [ "$(date +%s)" -ge "$FINE" ] && break
            sleep "${INTERVALLO_SEC}"
          done

      - name: Riavvia la catena
        if: always()
        env:
          PS_PAT: ${{ secrets.PS_PAT }}
        run: |
          if [ -n "${PS_PAT:-}" ] ; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${PS_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/scrape-ps.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "self-restart via PS_PAT -> HTTP $code (204 = ok)"
          else
            echo "PS_PAT non impostato: il riavvio dipende dallo schedule cron (best-effort)."
            echo "Per copertura 24/7 senza buchi imposta il secret PS_PAT (vedi README)."
          fi
